                                <input type="text" class="form-control form-control-sm organ-input" id="ub_calculi" data-organ="URINARY BLADDER" data-template="Urinary bladder calculi: {val}." placeholder="e.g. None">
                            </div>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label small font-mono fw-semibold text-secondary mb-1">Checkboxes</label>
                            <div class="form-check mb-1">
                                <input class="form-check-input organ-check" type="checkbox" id="ub_normal" data-organ="URINARY BLADDER" data-sentence="Urinary bladder is well distended with clear lumen. Wall thickness and mucosal contour are normal. No intraluminal calculus or mass." checked>
                                <label class="form-check-label small fw-semibold text-dark" for="ub_normal">Normal Urinary Bladder</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input organ-check" type="checkbox" id="ub_thickening" data-organ="URINARY BLADDER" data-sentence="Diffuse mucosal wall thickening noted in urinary bladder, suggestive of cystitis.">
                                <label class="form-check-label small text-dark" for="ub_thickening">Cystitis / Wall Thickening</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input organ-check" type="checkbox" id="ub_stone" data-organ="URINARY BLADDER" data-sentence="Echogenic calculus with acoustic shadowing noted within the urinary bladder lumen.">
                                <label class="form-check-label small text-dark" for="ub_stone">Bladder Stone</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input organ-check" type="checkbox" id="ub_residual" data-organ="URINARY BLADDER" data-sentence="Significant post-void residual urine volume noted.">
                                <label class="form-check-label small text-dark" for="ub_residual">Significant Residual Urine</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 8. CONCLUSION / IMPRESSION -->
        <div class="accordion-item border rounded overflow-hidden">
            <h2 class="accordion-header" id="headingConc">
                <button class="accordion-button collapsed py-2 px-3 bg-light fw-bold text-dark" style="font-size: 13px;" type="button" data-bs-toggle="collapse" data-bs-target="#collapseConc" aria-expanded="false" aria-controls="collapseConc">
                    <span class="material-symbols-outlined fs-6 text-primary me-2">verified</span>
                    8. CONCLUSION & IMPRESSION QUICK SELECT
                </button>
            </h2>
            <div id="collapseConc" class="accordion-collapse collapse" aria-labelledby="headingConc">
                <div class="accordion-body p-3">
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addImpressionLine('Normal ultrasound scan of whole abdomen.')">+ Normal Scan</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addImpressionLine('Grade II Fatty Liver.')">+ Grade II Fatty Liver</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addImpressionLine('Cholelithiasis (Gallbladder stones).')">+ Gallstones</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addImpressionLine('Right Renal Calculus.')">+ Right Kidney Stone</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addImpressionLine('Left Renal Calculus.')">+ Left Kidney Stone</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addImpressionLine('Prostatomegaly / Benign Prostatic Hyperplasia (BPH).')">+ Prostatomegaly (BPH)</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
