{% extends "base.html" %}

{% block title %}Change Password - MJ Ultrasound Reporting System{% endblock %}

{% block content %}
<div class="container-fluid max-w-xl px-0 mx-auto" style="max-width: 500px;">
    <!-- Card Form -->
    <div class="card border shadow-sm rounded-3 overflow-hidden bg-white mt-3">
        <div class="card-header bg-slate-50 py-3 px-4 border-bottom" style="background-color: #f8fafc; border-color: var(--outline-variant) !important;">
            <div class="d-flex align-items-center gap-2">
                <span class="material-symbols-outlined text-primary fs-5" style="color: #022e67 !important;">key</span>
                <div>
                    <h1 class="h6 fw-bold text-slate-900 mb-0 font-headline-md" style="font-size: 16px;">Change Your Password</h1>
                    <p class="text-slate-500 mb-0 small">Update your login credentials securely.</p>
                </div>
            </div>
        </div>

        <div class="card-body p-4">
            <form action="/change-password" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-slate-700" style="font-size: 13px;">Current Password <span class="text-danger">*</span></label>
                    <input type="password" name="current_password" class="form-control form-control-clinical" placeholder="Enter current password" required autocomplete="current-password">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-slate-700" style="font-size: 13px;">New Password <span class="text-danger">*</span></label>
                    <input type="password" name="new_password" class="form-control form-control-clinical" placeholder="Minimum 4 characters" required minlength="4" autocomplete="new-password">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-slate-700" style="font-size: 13px;">Confirm New Password <span class="text-danger">*</span></label>
                    <input type="password" name="confirm_password" class="form-control form-control-clinical" placeholder="Re-enter new password" required minlength="4" autocomplete="new-password">
                </div>

                <div class="mt-4 pt-3 border-top d-flex align-items-center justify-content-end gap-2" style="border-color: var(--outline-variant) !important;">
                    <a href="/dashboard" class="btn btn-outline-secondary py-2 px-3" style="font-size: 13px; font-weight: 500;">Cancel</a>
                    <button type="submit" class="btn btn-primary py-2 px-4 d-flex align-items-center gap-1.5" style="font-size: 13px; font-weight: 600; background-color: #022e67; border-color: #022e67;">
                        <span class="material-symbols-outlined fs-6">lock_reset</span>
                        <span>Update Password</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
