<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - MJ Ultrasound Reporting System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Google reCAPTCHA Enterprise / v2 API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --surface-bright: #f1f5f9;
            --outline-variant: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 430px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            box-sizing: border-box;
        }

        .login-card h2,
        .login-card h4,
        .login-card p {
            text-align: center;
        }

        .form-control-clinical {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #d0d7de;
            font-size: 15px;
        }

        .form-control-clinical:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 .15rem rgba(13,110,253,.15);
        }

        .clinical-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #495057;
        }

        .btn-primary {
            height: 48px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: .95;
        }

        .btn-primary:disabled {
            background-color: #8198be !important;
            border-color: #8198be !important;
            cursor: not-allowed;
            opacity: 0.65;
        }

        img {
            display: block;
            margin: auto;
        }

        .clinic-title {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            color: #022e67;
            margin: 0;
            letter-spacing: 2px;
        }

        .clinic-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: #4975da;
            padding-top: 4px;
            padding-bottom: 0px;
        }
    </style>
</head>
<body>

    <div class="login-card">

    <!-- Logo -->
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/2..png') }}" alt="MJ Ultrasound Reporting System" style="width:100px;height:auto;" class="mb-3">
        <h2 class="clinic-title">MJ ULTRASOUND</h2>
        <h4 class="clinic-subtitle">Reporting System</h4>
    </div>

    <!-- Client / Server Alert Container -->
    <div id="alertContainer">
        {% set messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mb-3">
                {% for category, message in messages %}
                    <div class="alert alert-{% if category == 'error' or category == 'danger' %}danger{% else %}{{ category }}{% endif %} small py-2 text-start mb-2" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <!-- Login Form -->
    <form action="/login" method="POST" id="loginForm" autocomplete="off">
        <!-- Username -->
        <div class="mb-3 text-start">
            <label class="clinical-label" for="usernameInput">Username</label>
            <input type="text" id="usernameInput" name="username" class="form-control form-control-clinical" placeholder="Enter Username" value="" required autofocus autocomplete="off">
        </div>

        <!-- Password -->
        <div class="mb-3 text-start">
            <label class="clinical-label" for="passwordInput">Password</label>
            <input type="password" id="passwordInput" name="password" class="form-control form-control-clinical" placeholder="Enter Password" value="" required autocomplete="new-password">
        </div>

        <!-- Google reCAPTCHA Container -->
        <div class="recaptcha-container mb-3 d-flex justify-content-center">
            <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key or '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI' }}"></div>
        </div>

        <!-- Submit Button Wrapper -->
        <div id="loginBtnWrapper" class="w-100 mt-3">
            <button type="submit" id="loginBtn" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2" style="background-color: #022e67; border-color: #022e67;">
                <span class="material-symbols-outlined fs-6">login</span>
                Sign In to Portal
            </button>
        </div>
    </form>

</div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function() {
            function clearFields() {
                const uInput = document.getElementById('usernameInput');
                const pInput = document.getElementById('passwordInput');
                if (uInput) uInput.value = '';
                if (pInput) pInput.value = '';
            }

            clearFields();
            window.addEventListener('pageshow', clearFields);
            window.addEventListener('DOMContentLoaded', clearFields);

            const urlParams = new URLSearchParams(window.location.search);
            const isLogout = urlParams.has('logout');

            if (isLogout) {
                localStorage.removeItem('mj_session_token');
                sessionStorage.removeItem('mj_session_token');
                document.cookie = 'session_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure';
                document.cookie = 'mj_auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure';
                document.cookie = 'connect.sid=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure';
            }

            const existingToken = localStorage.getItem('mj_session_token') || sessionStorage.getItem('mj_session_token');

            if (existingToken && !isLogout) {
                // Test token validation in background
                fetch('/api/validate-session', {
                    headers: { 'x-session-token': existingToken, 'Accept': 'application/json' }
                }).then(res => res.json()).then(data => {
                    if (data && data.valid) {
                        window.location.href = '/dashboard?token=' + encodeURIComponent(existingToken);
                    } else {
                        localStorage.removeItem('mj_session_token');
                        sessionStorage.removeItem('mj_session_token');
                    }
                }).catch(() => {});
            }

            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const alertContainer = document.getElementById('alertContainer');

            if (loginForm && loginBtn) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const username = document.getElementById('usernameInput').value.trim();
                    const password = document.getElementById('passwordInput').value;
                    let recaptchaToken = '';
                    if (typeof grecaptcha !== 'undefined') {
                        try {
                            recaptchaToken = grecaptcha.getResponse();
                        } catch (err) {}
                    }

                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Signing In...';

                    try {
                        const res = await fetch('/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({
                                username: username,
                                password: password,
                                'g-recaptcha-response': recaptchaToken
                            })
                        });

                        const data = await res.json();
                        if (res.ok && data.success) {
                            if (data.token) {
                                localStorage.setItem('mj_session_token', data.token);
                                sessionStorage.setItem('mj_session_token', data.token);
                                document.cookie = 'session_token=' + data.token + '; path=/; max-age=604800; SameSite=None; Secure; Partitioned';
                                document.cookie = 'mj_auth_token=' + data.token + '; path=/; max-age=604800; SameSite=None; Secure; Partitioned';
                                window.location.href = (data.redirect || '/dashboard') + '?token=' + encodeURIComponent(data.token);
                            } else {
                                window.location.href = data.redirect || '/dashboard';
                            }
                            return;
                        } else {
                            // Show error alert
                            const errMsg = data.error || data.message || 'Invalid username or password.';
                            if (alertContainer) {
                                alertContainer.innerHTML = '<div class="alert alert-danger small py-2 text-start mb-3" role="alert">' + errMsg + '</div>';
                            }
                            if (typeof grecaptcha !== 'undefined' && typeof grecaptcha.reset === 'function') {
                                try { grecaptcha.reset(); } catch(gErr) {}
                            }
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = '<span class="material-symbols-outlined fs-6">login</span> Sign In to Portal';
                        }
                    } catch (err) {
                        // Fallback to standard form submit
                        loginForm.submit();
                    }
                });
            }
        })();
    </script>
</body>
</html>
