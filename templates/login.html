<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - MJ Ultrasound Reporting System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Google reCAPTCHA v2 JS -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --surface-bright: #f1f5f9;
            --outline-variant: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 430px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            box-sizing: border-box;
        }

        .login-card h2,
        .login-card h4,
        .login-card p {
            text-align: center;
        }

        .form-control-clinical {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #d0d7de;
            font-size: 15px;
        }

        .form-control-clinical:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 .15rem rgba(13,110,253,.15);
        }

        .clinical-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #495057;
        }

        .btn-primary {
            height: 48px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: .95;
        }

        .btn-primary:disabled {
            background-color: #8198be !important;
            border-color: #8198be !important;
            cursor: not-allowed;
            opacity: 0.65;
        }

        img {
            display: block;
            margin: auto;
        }

        .clinic-title {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            color: #022e67;
            margin: 0;
            letter-spacing: 2px;
        }

        .clinic-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: #4975da;
            padding-top: 4px;
            padding-bottom: 0px;
        }

        /* reCAPTCHA responsive wrapper */
        .recaptcha-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 1.25rem;
            min-height: 78px;
            overflow: hidden;
        }

        /* Hide any text/heading above Google reCAPTCHA without breaking the checkbox or iframe */
        .recaptcha-container > *:not(.g-recaptcha):not(script):not(iframe),
        .recaptcha-title,
        .recaptcha-header,
        .recaptcha-label,
        .recaptcha-text,
        .protected-by-recaptcha {
            display: none !important;
        }

        @media (max-width: 380px) {
            .g-recaptcha {
                transform: scale(0.85);
                -webkit-transform: scale(0.85);
                transform-origin: center center;
                -webkit-transform-origin: center center;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

    <!-- Logo -->
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/2..png') }}" alt="MJ Ultrasound Reporting System" style="width:100px;height:auto;" class="mb-3">
        <h2 class="clinic-title">MJ ULTRASOUND</h2>
        <h4 class="clinic-subtitle">Reporting System</h4>
    </div>

    <!-- Client / Server Alert Container -->
    <div id="alertContainer">
        {% set messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mb-3">
                {% for category, message in messages %}
                    <div class="alert alert-{% if category == 'error' or category == 'danger' %}danger{% else %}{{ category }}{% endif %} small py-2 text-start mb-2" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm">
        <!-- Username -->
        <div class="mb-3 text-start">
            <label class="clinical-label" for="usernameInput">Username</label>
            <input type="text" id="usernameInput" name="username" class="form-control form-control-clinical" placeholder="Enter Username" required autofocus autocomplete="username">
        </div>

        <!-- Password -->
        <div class="mb-3 text-start">
            <label class="clinical-label" for="passwordInput">Password</label>
            <input type="password" id="passwordInput" name="password" class="form-control form-control-clinical" placeholder="Enter Password" required autocomplete="current-password">
        </div>  

        <!-- Google reCAPTCHA v2 Checkbox -->
        <div class="recaptcha-container">
            <div class="g-recaptcha" 
                 data-sitekey="{{ recaptcha_site_key if recaptcha_site_key else '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI' }}" 
                 data-callback="onRecaptchaSuccess" 
                 data-expired-callback="onRecaptchaExpired"></div>
        </div>

        <!-- Submit Button Wrapper -->
        <div id="loginBtnWrapper" class="w-100">
            <button type="submit" id="loginBtn" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2" style="background-color: #022e67; border-color: #022e67;" disabled>
                <span class="material-symbols-outlined fs-6">login</span>
                Sign In to Portal
            </button>
        </div>
    </form>

</div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- reCAPTCHA & Form Validation JavaScript -->
    <script>
        let recaptchaToken = '';

        function onRecaptchaSuccess(response) {
            recaptchaToken = response;
            validateLoginForm();
        }

        function onRecaptchaExpired() {
            recaptchaToken = '';
            validateLoginForm();
        }

        function validateLoginForm() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            let currentToken = recaptchaToken;
            if (!currentToken && typeof grecaptcha !== 'undefined' && grecaptcha.getResponse) {
                try {
                    currentToken = grecaptcha.getResponse();
                } catch(e) {}
            }

            if (username !== '' && password !== '' && currentToken !== '') {
                loginBtn.disabled = false;
            } else {
                loginBtn.disabled = true;
            }
        }

        function showCaptchaWarning(message) {
            const alertContainer = document.getElementById('alertContainer');
            if (alertContainer) {
                alertContainer.innerHTML = `
                    <div class="mb-3">
                        <div class="alert alert-danger small py-2 text-start mb-2" role="alert">
                            ${message}
                        </div>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginForm = document.getElementById('loginForm');
            const loginBtnWrapper = document.getElementById('loginBtnWrapper');

            if (usernameInput) usernameInput.addEventListener('input', validateLoginForm);
            if (passwordInput) passwordInput.addEventListener('input', validateLoginForm);

            // Handle user clicking on disabled button area
            if (loginBtnWrapper) {
                loginBtnWrapper.addEventListener('click', function(e) {
                    const loginBtn = document.getElementById('loginBtn');
                    if (loginBtn && loginBtn.disabled) {
                        let token = recaptchaToken;
                        if (!token && typeof grecaptcha !== 'undefined' && grecaptcha.getResponse) {
                            try { token = grecaptcha.getResponse(); } catch(err) {}
                        }
                        if (!token) {
                            showCaptchaWarning("Please verify that you are not a robot.");
                        }
                    }
                });
            }

            // Handle form submission
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    let token = recaptchaToken;
                    if (!token && typeof grecaptcha !== 'undefined' && grecaptcha.getResponse) {
                        try { token = grecaptcha.getResponse(); } catch(err) {}
                    }

                    if (!token) {
                        e.preventDefault();
                        showCaptchaWarning("Please verify that you are not a robot.");
                        if (typeof grecaptcha !== 'undefined' && grecaptcha.reset) {
                            try { grecaptcha.reset(); } catch(err) {}
                        }
                        recaptchaToken = '';
                        validateLoginForm();
                        return false;
                    }
                });
            }

            // Reset captcha on load if page reloaded after failed attempt
            setTimeout(function() {
                validateLoginForm();
            }, 500);
        });
    </script>
</body>
</html>
